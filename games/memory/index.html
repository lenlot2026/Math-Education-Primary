<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ល្បែងចងចាំ - Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #f97316;">ល្បែងចងចាំ 🧠</h1>
            <p>បើកកាតដើម្បីផ្គូផ្គងរូបភាព</p>
        </header>

        <main class="game-area">
            <div class="status-bar">
                <div class="score">ចំនួនបើក: <span id="flips">០</span></div>
                <div class="timer">ម៉ោង: <span id="time">00:00</span></div>
            </div>

            <div id="start-screen" class="screen active">
                <button id="btn-start" class="btn-large" style="background: #f97316;">ចាប់ផ្តើមលេង (Start)</button>
            </div>

            <div id="play-screen" class="screen">
                <div class="memory-grid" id="memory-grid">
                    <!-- Cards injected here -->
                </div>
            </div>

            <div id="end-screen" class="screen">
                <h2 style="color: #f97316;">អបអរសាទរ!</h2>
                <p>អ្នកចំណាយពេល <span id="final-time">00:00</span> និងបើកកាតចំនួន <span id="final-flips">០</span> ដង។</p>
                <button id="btn-restart" class="btn-large" style="background: #f97316;">លេងម្តងទៀត</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
