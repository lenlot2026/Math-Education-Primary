<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លេខគូ និងសេស - Even or Odd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #06b6d4;">លេខគូ និងសេស 🔢</h1>
            <p>តើលេខខាងក្រោមជាលេខគូ ឬសេស?</p>
        </header>

        <main class="game-area">
            <div class="status-bar">
                <div class="score">ពិន្ទុ: <span id="score">០</span></div>
                <div class="timer">សំណួរទី: <span id="question-num">១</span>/១០</div>
            </div>

            <div id="start-screen" class="screen active">
                <button id="btn-start" class="btn-large" style="background: #06b6d4;">ចាប់ផ្តើមលេង (Start)</button>
            </div>

            <div id="play-screen" class="screen">
                <div class="number-box">
                    <span id="target-number">?</span>
                </div>
                
                <div class="options-grid two-cols">
                    <button class="option-btn text-option" data-val="even">លេខគូ (Even)</button>
                    <button class="option-btn text-option" data-val="odd">លេខសេស (Odd)</button>
                </div>
            </div>

            <div id="end-screen" class="screen">
                <h2 style="color: #06b6d4;">លេងចប់ហើយ!</h2>
                <p>ពិន្ទុរបស់អ្នកគឺ៖ <span id="final-score">០</span> / ១០</p>
                <button id="btn-restart" class="btn-large" style="background: #06b6d4;">លេងម្តងទៀត</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
