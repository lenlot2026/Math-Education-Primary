<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>តារាងពិន្ទុក្រុម - Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 900px;">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #10b981;">តារាងពិន្ទុក្រុម 🏆</h1>
            <p>កត់ត្រា និងបូកពិន្ទុសម្រាប់ក្រុមនីមួយៗ</p>
        </header>

        <main class="scoreboard-area">
            <div class="settings">
                <label>ចំនួនក្រុម:</label>
                <input type="number" id="num-teams" value="3" min="2" max="6">
                <button id="btn-setup" class="btn-secondary">រៀបចំតារាង (Setup)</button>
            </div>
            
            <div id="teams-container" class="teams-grid">
                <!-- Teams injected here -->
            </div>
            
            <div class="controls" style="margin-top: 30px; text-align: center;">
                <button id="btn-reset" class="btn-large" style="background: #ef4444;">លុបពិន្ទុទាំងអស់ (Reset Scores)</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
