<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាប់លេខចៃដន្យ - Random Number Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 600px;">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #ef4444;">ចាប់លេខចៃដន្យ 🎲</h1>
            <p>ជ្រើសរើសលេខរៀងដោយស្វ័យប្រវត្តិ</p>
        </header>

        <main class="randomizer-area">
            <div class="settings">
                <div class="input-group">
                    <label>លេខចាប់ផ្តើម (Min):</label>
                    <input type="number" id="min-val" value="1">
                </div>
                <div class="input-group">
                    <label>លេខបញ្ចប់ (Max):</label>
                    <input type="number" id="max-val" value="50">
                </div>
            </div>

            <div class="result-box">
                <span id="random-result">?</span>
            </div>

            <button id="btn-pick" class="btn-large" style="background: #ef4444;">ចាប់លេខឥឡូវនេះ!</button>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
