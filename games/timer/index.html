<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>នាឡិកាកំណត់ម៉ោង - Classroom Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 600px;">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #3b82f6;">នាឡិកាកំណត់ម៉ោង ⏱️</h1>
            <p>កំណត់ម៉ោងសម្រាប់ធ្វើលំហាត់ក្នុងថ្នាក់</p>
        </header>

        <main class="timer-area">
            <div class="timer-display" id="time-display">05:00</div>
            
            <div class="settings" id="timer-settings">
                <div class="input-group">
                    <label>នាទី (Min):</label>
                    <input type="number" id="input-min" value="5" min="0" max="99">
                </div>
                <div class="input-group">
                    <label>វិនាទី (Sec):</label>
                    <input type="number" id="input-sec" value="0" min="0" max="59">
                </div>
            </div>

            <div class="controls">
                <button id="btn-start" class="btn-large" style="background: #22c55e;">ចាប់ផ្តើម (Start)</button>
                <button id="btn-pause" class="btn-large hidden" style="background: #f59e0b;">ផ្អាក (Pause)</button>
                <button id="btn-reset" class="btn-large" style="background: #ef4444;">សារឡើងវិញ (Reset)</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
