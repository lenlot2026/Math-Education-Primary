<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ក្តារខៀនឌីជីថល - Digital Whiteboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../fast_math/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 1000px; width: 100%;">
        <header class="app-header">
            <a href="../../index.html" class="btn-back">⬅️ ត្រលប់ក្រោយ (Back)</a>
            <h1 style="color: #f43f5e;">ក្តារខៀនឌីជីថល ✏️</h1>
        </header>

        <main class="whiteboard-area">
            <div class="toolbar">
                <input type="color" id="color-picker" value="#000000">
                <input type="range" id="size-picker" min="1" max="50" value="5">
                <button id="btn-erase" class="btn-tool">ជ័រលុប (Eraser)</button>
                <button id="btn-clear" class="btn-tool" style="background: #ef4444; color: white;">លុបទាំងអស់ (Clear)</button>
            </div>
            
            <div class="canvas-container">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
<script src="../../js/confetti.min.js"></script>
<script src="../../js/audio.js"></script>
</body>
</html>
